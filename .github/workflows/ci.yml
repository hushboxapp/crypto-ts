name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run Lint
        id: lint
        run: |
          if npm run lint > lint-output.txt 2>&1; then
            echo "FAILED=false" >> $GITHUB_OUTPUT
          else
            echo "FAILED=true" >> $GITHUB_OUTPUT
          fi
          cat lint-output.txt
      - name: Check Formatting
        run: npm run format:check
      - name: Check Types
        run: npm run type-check
      - name: Add Lint to Summary
        run: |
          echo "## Linting Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.lint.outputs.FAILED }}" == "true" ]; then
            echo "❌ **Linting failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat lint-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Linting passed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run Audit
        id: audit
        run: |
          if npm audit --audit-level=high > audit-output.txt 2>&1; then
            echo "FAILED=false" >> $GITHUB_OUTPUT
          else
            echo "FAILED=true" >> $GITHUB_OUTPUT
          fi
          cat audit-output.txt
      - name: Verify Dependency Signatures
        id: signatures
        run: |
          if npm audit signatures > signatures-output.txt 2>&1; then
            echo "FAILED=false" >> $GITHUB_OUTPUT
          else
            echo "FAILED=true" >> $GITHUB_OUTPUT
          fi
          cat signatures-output.txt
      - name: Add Audit to Summary
        run: |
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outputs.FAILED }}" == "true" ]; then
            echo "❌ **Security vulnerabilities found (high or above)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **No high-level security vulnerabilities found.**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.signatures.outputs.FAILED }}" == "true" ]; then
            echo "❌ **Dependency signature verification failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat signatures-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All dependency registry signatures verified.**" >> $GITHUB_STEP_SUMMARY
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:node -- --coverage
      - name: Add Coverage to Summary
        run: |
          SUMMARY=$(cat coverage/coverage-summary.json)
          LINES=$(echo $SUMMARY | jq -r '.total.lines.pct')
          STATEMENTS=$(echo $SUMMARY | jq -r '.total.statements.pct')
          FUNCTIONS=$(echo $SUMMARY | jq -r '.total.functions.pct')
          BRANCHES=$(echo $SUMMARY | jq -r '.total.branches.pct')

          echo "## Code Coverage Results" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Percentage |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lines** | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Statements** | ${STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Functions** | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branches** | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$LINES < 90" | bc -l) )); then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Coverage is below 90%!**" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Coverage to Coveralls
        # Fork and Dependabot pull requests do not receive repository secrets.
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/lcov.info
          format: lcov
        env:
          # Use repo-token authentication instead of the default GitHub-token mode.
          COVERALLS_SERVICE_NAME: github-actions

  test-node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Build Package
        run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test Packed Package
        run: npm run test:package
      - name: Run Node Tests
        id: tests
        run: |
          # Use --reporter=github-actions for annotations and --reporter=default for logs
          if npm run test:node -- --reporter=default --reporter=github-actions > test-output.txt 2>&1; then
            echo "FAILED=false" >> $GITHUB_OUTPUT
          else
            echo "FAILED=true" >> $GITHUB_OUTPUT
          fi
          cat test-output.txt
      - name: Add Node Tests to Summary
        run: |
          echo "## Node ${{ matrix.node-version }} Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tests.outputs.FAILED }}" == "true" ]; then
            echo "❌ **Node ${{ matrix.node-version }} tests failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Node ${{ matrix.node-version }} tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi

  test-browser:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Browser Tests
        id: tests
        run: |
          # Override the browser name from the matrix
          if npm run test -- --browser.name=${{ matrix.browser }} --reporter=default --reporter=github-actions > test-output.txt 2>&1; then
            echo "FAILED=false" >> $GITHUB_OUTPUT
          else
            echo "FAILED=true" >> $GITHUB_OUTPUT
          fi
          cat test-output.txt
      - name: Add Browser Tests to Summary
        run: |
          echo "## Browser ${{ matrix.browser }} Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tests.outputs.FAILED }}" == "true" ]; then
            echo "❌ **Browser ${{ matrix.browser }} tests failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Browser ${{ matrix.browser }} tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi
